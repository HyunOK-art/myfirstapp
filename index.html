<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하늘구슬 — 소개 페이지</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue-deep:    #c2587a;
      --blue-mid:     #e8829f;
      --blue-light:   #f5b8c8;
      --blue-pale:    #fcdee6;
      --white:        #ffffff;
      --white-trans:  rgba(255,255,255,0.85);
      --petal-pink:   rgba(255,200,215,0.75);
      --petal-white:  rgba(255,248,252,0.85);
      --shadow:       rgba(180,80,110,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      font-family: 'Noto Serif KR', serif;
      overflow-x: hidden;
    }

    /* ── GRADIENT BACKGROUND ─────────────────────────────── */
    body {
      background: linear-gradient(160deg,
        #e8a0b4 0%,
        #f5c0ce 30%,
        #fad4df 60%,
        #fde8ef 82%,
        #fff5f8 100%);
      min-height: 100vh;
    }

    /* ── CANVAS FOR PETALS ───────────────────────────────── */
    #petalCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── MUSIC BUTTON ────────────────────────────────────── */
    #musicBtn {
      position: fixed;
      top: 22px; right: 28px;
      z-index: 100;
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.55);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      box-shadow: 0 4px 18px var(--shadow);
    }
    #musicBtn:hover { background: rgba(255,255,255,0.32); transform: scale(1.08); }
    #musicBtn svg { width: 22px; height: 22px; }
    #musicBtn .icon-play  { display: block; }
    #musicBtn .icon-pause { display: none; }
    #musicBtn.playing .icon-play  { display: none; }
    #musicBtn.playing .icon-pause { display: block; }

    /* ── MAIN WRAPPER ─────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 60px;
    }

    /* ── CARD ─────────────────────────────────────────────── */
    .card {
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(22px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.38);
      border-radius: 32px;
      max-width: 680px;
      width: 100%;
      padding: 60px 52px 52px;
      box-shadow:
        0 8px 48px rgba(180,80,110,0.18),
        0 2px 8px rgba(255,255,255,0.12) inset;
      animation: fadeUp 1.2s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── FLOWER DECO ──────────────────────────────────────── */
    .deco-line {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      animation: fadeUp 1.2s 0.15s cubic-bezier(0.22,1,0.36,1) both;
    }
    .deco-line span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); }
    .deco-flower {
      font-size: 22px;
      filter: drop-shadow(0 0 6px rgba(255,200,210,0.7));
      animation: spin-slow 10s linear infinite;
    }
    @keyframes spin-slow { to { transform: rotate(360deg); } }

    /* ── NAME ─────────────────────────────────────────────── */
    .name-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(13px, 2vw, 16px);
      letter-spacing: 0.28em;
      color: rgba(255,255,255,0.95);
      text-transform: uppercase;
      margin-bottom: 8px;
      animation: fadeUp 1.2s 0.25s cubic-bezier(0.22,1,0.36,1) both;
    }
    .name-ko {
      font-size: clamp(38px, 7vw, 58px);
      font-weight: 700;
      color: #5a1228;
      letter-spacing: 0.12em;
      line-height: 1.1;
      text-shadow: 0 4px 24px rgba(180,80,110,0.28);
      margin-bottom: 6px;
      animation: fadeUp 1.2s 0.32s cubic-bezier(0.22,1,0.36,1) both;
    }
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(15px, 2.4vw, 19px);
      color: rgba(255,255,255,0.95);
      letter-spacing: 0.06em;
      margin-bottom: 38px;
      animation: fadeUp 1.2s 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* ── DIVIDER ──────────────────────────────────────────── */
    .divider {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.15), rgba(255,255,255,0.7), rgba(255,255,255,0.15));
      border-radius: 2px;
      margin: 0 0 34px;
      animation: fadeUp 1.2s 0.48s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* ── BIO TEXT ─────────────────────────────────────────── */
    .bio {
      font-size: clamp(14px, 1.9vw, 16.5px);
      line-height: 2;
      color: rgba(100,30,50,0.95);
      word-break: keep-all;
      margin-bottom: 40px;
      animation: fadeUp 1.2s 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }
    .bio strong { color: #6b1a30; font-weight: 700; }

    /* ── SKILLS / TAGS ────────────────────────────────────── */
    .tags {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-bottom: 44px;
      animation: fadeUp 1.2s 0.63s cubic-bezier(0.22,1,0.36,1) both;
    }
    .tag {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.32);
      color: rgba(100,30,50,0.92);
      font-size: 13px;
      letter-spacing: 0.06em;
      padding: 6px 16px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      transition: background 0.25s, transform 0.2s;
    }
    .tag:hover { background: rgba(255,255,255,0.26); transform: translateY(-2px); }

    /* ── LINKS ────────────────────────────────────────────── */
    .links {
      display: flex; gap: 14px; flex-wrap: wrap;
      animation: fadeUp 1.2s 0.72s cubic-bezier(0.22,1,0.36,1) both;
    }
    .link-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 26px;
      border-radius: 999px;
      font-size: 14px;
      font-family: 'Noto Serif KR', serif;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.25s;
      cursor: pointer;
    }
    .link-btn.primary {
      background: rgba(255,255,255,0.92);
      color: #b84870;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(180,80,110,0.22);
    }
    .link-btn.primary:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(180,80,110,0.3); }
    .link-btn.ghost {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.5);
      color: #fff;
    }
    .link-btn.ghost:hover { background: rgba(255,255,255,0.14); transform: translateY(-3px); }

    /* ── FOOTER ───────────────────────────────────────────── */
    .footer {
      margin-top: 52px;
      color: rgba(150,60,80,0.7);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      letter-spacing: 0.1em;
      animation: fadeUp 1.4s 0.9s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* ── RESPONSIVE ───────────────────────────────────────── */
    @media (max-width: 520px) {
      .card { padding: 40px 28px 36px; border-radius: 22px; }
    }
  </style>
</head>
<body>

<!-- Petal canvas -->
<canvas id="petalCanvas"></canvas>

<!-- Background music -->
<audio id="bgMusic" loop>
  <source src="bg.mp3" type="audio/mpeg" />
</audio>

<!-- Music toggle button -->
<button id="musicBtn" title="음악 켜기/끄기" aria-label="음악 켜기/끄기">
  <!-- Play icon -->
  <svg class="icon-play" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="5 3 19 12 5 21 5 3" fill="white" stroke="none"/>
  </svg>
  <!-- Pause icon -->
  <svg class="icon-pause" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
    <line x1="8"  y1="5" x2="8"  y2="19"/>
    <line x1="16" y1="5" x2="16" y2="19"/>
  </svg>
</button>

<!-- Main content -->
<main class="page">
  <article class="card">
    <div class="deco-line">
      <span></span>
      <div class="deco-flower">✿</div>
      <span></span>
    </div>

    <p class="name-en">Haneul-Gusul &nbsp;·&nbsp; Personal Page</p>
    <h1 class="name-ko">하늘구슬</h1>
    <p class="tagline">매화처럼, 고요하되 향기롭게</p>

    <div class="divider"></div>

    <p class="bio">
      안녕하세요, <strong>하늘구슬</strong>입니다. 🌸<br>
      저는 아름다운 것들을 가까이 두고, 진심 어린 연결을 소중히 여기는 사람입니다.<br>
      좋아하는 것들 — 음악, 글, 조용한 아침 — 이 모여 저를 만듭니다.<br>
      이 작은 공간이 저를 조금 더 잘 알 수 있는 창이 되기를 바랍니다.
    </p>

    <div class="tags">
      <span class="tag">🎵 음악</span>
      <span class="tag">📖 독서</span>
      <span class="tag">✍️ 글쓰기</span>
      <span class="tag">🌸 자연</span>
      <span class="tag">☕ 커피</span>
      <span class="tag">💻 기술</span>
    </div>

    <div class="links">
      <a href="https://github.com/" class="link-btn primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub
      </a>
      <a href="mailto:hello@example.com" class="link-btn ghost">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        이메일
      </a>
    </div>
  </article>

  <footer class="footer">ⓒ 2024 하늘구슬 · Made with 🌸</footer>
</main>

<script>
/* ── MUSIC TOGGLE ─────────────────────────────────────────── */
const btn   = document.getElementById('musicBtn');
const audio = document.getElementById('bgMusic');
audio.volume = 0.45;

btn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play().catch(() => {});
    btn.classList.add('playing');
  } else {
    audio.pause();
    btn.classList.remove('playing');
  }
});

/* ── PETAL CANVAS ─────────────────────────────────────────── */
const canvas = document.getElementById('petalCanvas');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* Draw a simple 5-petal plum blossom silhouette */
function drawPetal(ctx, size, color, opacity) {
  ctx.globalAlpha = opacity;
  const petals = 5;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < petals; i++) {
    const angle = (i / petals) * Math.PI * 2 - Math.PI / 2;
    const px = Math.cos(angle) * size * 0.55;
    const py = Math.sin(angle) * size * 0.55;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(angle + Math.PI / 2);
    ctx.ellipse(0, 0, size * 0.28, size * 0.42, 0, 0, Math.PI * 2);
    ctx.restore();
  }
  ctx.fill();
  /* centre dot */
  ctx.fillStyle = 'rgba(255,220,230,0.9)';
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

const PETAL_COLORS = [
  'rgba(255,210,225,0.72)',
  'rgba(240,220,235,0.65)',
  'rgba(255,235,242,0.78)',
  'rgba(200,220,255,0.55)',
  'rgba(255,245,248,0.80)',
];

const NUM_PETALS = 38;
const petals = [];

for (let i = 0; i < NUM_PETALS; i++) {
  petals.push({
    x:      Math.random() * window.innerWidth,
    y:      Math.random() * window.innerHeight * 1.2 - window.innerHeight * 0.2,
    size:   8 + Math.random() * 18,
    color:  PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)],
    opacity: 0.45 + Math.random() * 0.45,
    speedX: (Math.random() - 0.5) * 0.55,
    speedY: 0.45 + Math.random() * 0.9,
    rot:    Math.random() * Math.PI * 2,
    rotSpd: (Math.random() - 0.5) * 0.025,
    sway:   Math.random() * Math.PI * 2,
    swayA:  0.5 + Math.random() * 1.2,
    swaySpd: 0.008 + Math.random() * 0.012,
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const W = canvas.width;
  const H = canvas.height;

  petals.forEach(p => {
    p.sway += p.swaySpd;
    p.x    += p.speedX + Math.sin(p.sway) * p.swayA;
    p.y    += p.speedY;
    p.rot  += p.rotSpd;

    if (p.y > H + p.size * 2) {
      p.y = -p.size * 2;
      p.x = Math.random() * W;
    }
    if (p.x > W + p.size) p.x = -p.size;
    if (p.x < -p.size)    p.x =  W + p.size;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    drawPetal(ctx, p.size, p.color, p.opacity);
    ctx.restore();
  });

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
